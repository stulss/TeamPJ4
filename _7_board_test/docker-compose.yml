services:
  mysql:
    image: backup-flask_mysql:20260923
    container_name: flask_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: "my_new_board_db"
    ports:
      - "3306:3306"
    volumes:
      - 7_test_class_mysql_data:/var/lib/mysql

volumes:
  7_test_class_mysql_data:
    external: true
